name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same pull request supersedes this run, so the older one is cancelled rather
# than holding runners the newer one is queued for. Every other run gets a group of its own, so a push
# to main is never cancelled or queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5'

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Run tests
      run: swift test --parallel

    - name: Run tests (release)
      run: swift test -c release --parallel
