name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Run tests
      run: swift test --parallel

    - name: Run tests (release)
      run: swift test -c release --parallel
