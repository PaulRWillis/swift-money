name: Swift code coverage

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # A PAT rather than GITHUB_TOKEN, because the badge commit below pushes to main. Same token the
    # benchmark results commit uses.
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.BENCHMARK_PAT }}
        # Diff coverage needs the base branch, so the default shallow clone will not do.
        fetch-depth: 0

    - name: Swift version
      run: swift --version

    # No container, so Swift, python3 and the GitHub CLI all come from the runner image — the same
    # arrangement as the Linux build workflow.
    - name: Measure coverage
      if: github.event_name != 'pull_request'
      run: bash Coverage/run.sh --markdown coverage.md --badge

    - name: Measure coverage, and of the lines this pull request adds
      if: github.event_name == 'pull_request'
      run: |
        bash Coverage/run.sh \
          --diff "origin/${{ github.base_ref }}" \
          --markdown coverage.md

    - name: Job summary
      run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file coverage.md \
          --edit-last \
          --create-if-none

    - name: Commit the badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if git diff --quiet .github/badges/coverage.svg; then
          echo "Badge unchanged."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .github/badges/coverage.svg
        git commit -m "docs(coverage): update coverage badge [skip ci]"
        git push
