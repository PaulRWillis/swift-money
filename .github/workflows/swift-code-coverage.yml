name: Swift code coverage

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # No `paths:` filter here on purpose. This job is a Required check, so it must report on every pull
    # request. A path-filtered required check never triggers on a pull request outside its paths, so it
    # never reports, and GitHub parks the pull request forever on "Expected — Waiting for status". The
    # relevance decision instead lives in the `changes` step below, which gates the heavy coverage steps
    # on the same globs. A pull request that touches nothing here still runs the job to a clean finish
    # with those steps skipped, which reports the required check as passed with nothing to measure.

permissions:
  contents: write
  pull-requests: write

jobs:
  test-code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v6
      with:
        # Diff coverage needs the base branch, so the default shallow clone will not do.
        fetch-depth: 0

    # The one place the coverage-relevant paths are listed. On a pull request the heavy steps below run
    # only when `relevant` is true; on push and workflow_dispatch they always run (the `||` short-circuits
    # before this output is read). These globs are what the `pull_request` `paths:` filter used to hold.
    - name: Detect coverage-relevant changes
      id: changes
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v3
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'Coverage/**'
            - 'Package.swift'
            - 'Package.resolved'
            - '.github/workflows/swift-code-coverage.yml'

    - name: Swift version
      run: swift --version

    # No container, so Swift, python3 and the GitHub CLI all come from the runner image, the same
    # arrangement as the Linux build workflow.
    - name: Measure coverage
      if: github.event_name != 'pull_request'
      run: bash Coverage/run.sh --markdown coverage.md --badge

    - name: Measure coverage, and of the lines this pull request adds
      if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true'
      run: |
        bash Coverage/run.sh \
          --diff "origin/${{ github.base_ref }}" \
          --markdown coverage.md

    - name: Job summary
      if: github.event_name != 'pull_request' || steps.changes.outputs.relevant == 'true'
      run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

    # `--edit-last` edits the last comment by this actor, and the benchmark workflow also comments as
    # github-actions, so it was overwriting this one on every pull request. The marker gives each
    # workflow a comment of its own.
    - name: Comment on the pull request
      if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MARKER: "<!-- coverage-report -->"
        PR: ${{ github.event.pull_request.number }}
      run: |
        body="$(printf '%s\n\n%s' "$MARKER" "$(cat coverage.md)")"
        existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          | jq -r --arg marker "$MARKER" \
              '[.[] | select(.body | contains($marker))] | last | .id // empty')"

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          echo "Updated comment $existing"
        else
          gh pr comment "$PR" --body "$body"
        fi

    # The badge lives on the orphan `assets` branch, so publishing it never touches main and the
    # default GITHUB_TOKEN is enough. No `[skip ci]` needed: nothing triggers on `assets`.
    - uses: actions/checkout@v6
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        ref: assets
        path: assets-branch

    - name: Publish the badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cp .github/badges/coverage.svg assets-branch/coverage.svg
        cd assets-branch

        if git diff --quiet; then
          echo "Badge unchanged."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add coverage.svg
        git commit -m "docs(coverage): update coverage badge"
        # The benchmark workflow pushes to the same branch, so pick up its commit first.
        git pull --rebase
        git push
