name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  semantic-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # SemVer clause 4 leaves 0.y.z undefined, so every level is shifted one right for now: a
      # breaking change releases a minor, and a feature a patch. At 1.0.0, restore `breaking` to
      # major and `feat` to minor, which is SemVer proper.
      #
      # Only the three kinds of change SemVer names release at all. A refactor or a chore that a
      # caller cannot observe is not a version.
      - name: Semantic Release Config
        run: |
          echo "
          branches:
            - main
          preset: 'conventionalcommits'
          tagFormat: '\${version}'
          plugins:
            - - '@semantic-release/commit-analyzer'
              - releaseRules:
                - breaking: true
                  release: minor
                - type: feat
                  release: patch
                - type: fix
                  release: patch
                - type: perf
                  release: patch
                - type: build
                  release: patch
                - type: chore
                  release: false
                - scope: 'no-release'
                  release: false
                - scope: 'hotfix'
                  release: patch
                - scope: 'patch'
                  release: patch
                - scope: 'minor'
                  release: minor
                - scope: 'major'
                  release: major
            - - '@semantic-release/release-notes-generator'
            - - '@semantic-release/github'
              - successComment: false
                failTitle: false" > .releaserc.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release
        run: npm install semantic-release@v25 conventional-changelog-conventionalcommits@v9 -D

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
