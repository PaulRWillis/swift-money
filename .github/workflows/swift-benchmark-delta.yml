name: Benchmark PR vs main

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

# Stated rather than inherited from the repository default, since the comment below needs write access
# to pull requests and nothing here needs more than that.
permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-delta:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install jemalloc
      run: sudo apt-get install -y libjemalloc-dev

    - name: Check for benchmarks
      run: |
        [ -f Benchmarks/Package.swift ] && echo "hasBenchmark=1" >> $GITHUB_ENV
        echo "BENCHMARK_PACKAGE_PATH=--package-path Benchmarks" >> $GITHUB_ENV

    # Most of this job was compiling package-benchmark and its dependencies, which change only when
    # Package.resolved does. The restore keys deliberately match a stale build: SPM rebuilds what the
    # content hash says has changed, so a partial hit still saves the dependency compile.
    - name: Cache the benchmark build
      if: ${{ env.hasBenchmark == '1' }}
      uses: actions/cache@v4
      with:
        path: |
          Benchmarks/.build
          ~/.cache/org.swift.swiftpm
        key: benchmarks-${{ runner.os }}-${{ hashFiles('Benchmarks/Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Benchmarks/Benchmarks/**/*.swift') }}
        restore-keys: |
          benchmarks-${{ runner.os }}-${{ hashFiles('Benchmarks/Package.resolved') }}-
          benchmarks-${{ runner.os }}-

    - name: Resolve dependencies (with retry)
      if: ${{ env.hasBenchmark == '1' }}
      run: |
        for attempt in 1 2 3; do
          echo "Resolve attempt $attempt"
          if swift package ${BENCHMARK_PACKAGE_PATH} resolve; then
            echo "Dependencies resolved successfully"
            break
          fi
          echo "Attempt $attempt failed, cleaning and retrying..."
          rm -rf Benchmarks/.build/repositories
          sleep $((attempt * 10))
        done

    - name: Run benchmarks for PR branch
      if: ${{ env.hasBenchmark == '1' }}
      run: |
        swift package ${BENCHMARK_PACKAGE_PATH} --disable-sandbox benchmark baseline update pull_request --no-progress

    - name: Switch to main
      if: ${{ env.hasBenchmark == '1' }}
      run: |
        git stash
        git checkout main
        if [ -f Benchmarks/Package.swift ]; then
          echo "mainHasBenchmark=1" >> $GITHUB_ENV
        else
          echo "mainHasBenchmark=0" >> $GITHUB_ENV
          echo "::notice::main does not have Benchmarks yet — skipping comparison"
        fi

    - name: Run benchmarks for main
      if: ${{ env.hasBenchmark == '1' && env.mainHasBenchmark == '1' }}
      run: |
        swift package ${BENCHMARK_PACKAGE_PATH} --disable-sandbox benchmark baseline update main --no-progress

    - name: Compare PR and main
      if: ${{ env.hasBenchmark == '1' && env.mainHasBenchmark == '1' }}
      id: benchmark
      continue-on-error: true
      run: |
        echo "$(date)" >> $GITHUB_STEP_SUMMARY

        # `baseline check` reports its verdict through the exit status — 2 for a regression, 4 for an
        # improvement — so a non-zero status is the normal case, not a failure. Actions runs this block
        # as `bash -e`, which would abort here before the status could be read, taking every line below
        # with it and leaving `exitStatus` unset.
        set +e
        swift package ${BENCHMARK_PACKAGE_PATH} benchmark baseline check main pull_request --format markdown > benchmark_comparison.md 2>benchmark_stderr
        rawExitStatus=$?
        set -e

        cat benchmark_comparison.md >> $GITHUB_STEP_SUMMARY
        cat benchmark_stderr >&2
        if [ "$rawExitStatus" -eq 0 ]; then
          echo "exitStatus=0" >> $GITHUB_ENV
        elif grep -q "benchmarkThresholdRegression" benchmark_stderr; then
          echo "exitStatus=2" >> $GITHUB_ENV
        elif grep -q "benchmarkThresholdImprovement" benchmark_stderr; then
          echo "exitStatus=4" >> $GITHUB_ENV
        else
          echo "exitStatus=$rawExitStatus" >> $GITHUB_ENV
        fi

    # The step summary is readable only in a browser, so the table that decides the verdict is also
    # kept as an artifact, where it can be fetched and diffed.
    - name: Upload the comparison table
      if: ${{ env.hasBenchmark == '1' && env.mainHasBenchmark == '1' }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-comparison
        path: benchmark_comparison.md
        if-no-files-found: warn

    - name: Build PR comment
      if: ${{ env.hasBenchmark == '1' }}
      run: |
        BENCHMARK_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if [ "${{ env.mainHasBenchmark }}" != "1" ]; then
          echo "_Benchmarks ran successfully. No baseline on main yet — comparison will be available after merge._" > benchmark_comment
        elif [ "${{ env.exitStatus }}" = "0" ]; then
          echo "_No significant benchmark changes._" > benchmark_comment
        elif [ "${{ env.exitStatus }}" = "2" ]; then
          echo "_⚠️ Benchmark regression detected._" > benchmark_comment
        elif [ "${{ env.exitStatus }}" = "4" ]; then
          echo "_✅ Benchmark improvement detected._" > benchmark_comment
        else
          echo "_Benchmark comparison had an unknown result._" > benchmark_comment
        fi
        echo "[Benchmark run details](${BENCHMARK_RUN_URL})" >> benchmark_comment

    # The GitHub CLI is pre-installed on the runner, so this needs no action. `--edit-last` keeps one
    # comment updated in place rather than adding another on every push, which is what the previous
    # action's `comment-tag` was doing.
    # Guarded on the event too: this also runs on workflow_dispatch, where there is no pull request to
    # comment on.
    - name: Comment on PR
      if: ${{ env.hasBenchmark == '1' && github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file benchmark_comment \
          --edit-last \
          --create-if-none
