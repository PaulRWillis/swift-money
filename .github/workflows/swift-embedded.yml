name: Embedded Swift

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Scoped to what Embedded/verify.sh compiles (Core, FX and Localization only), so an unrelated
    # future package does not trigger it. The push trigger above is left unscoped as a post-merge
    # health signal.
    paths:
      - 'Sources/SwiftMoneyCore/**'
      - 'Sources/SwiftMoneyFX/**'
      - 'Sources/SwiftMoneyLocalization/**'
      - 'Embedded/**'
      - 'Package.swift'
      - '.github/workflows/swift-embedded.yml'

# A newer push to the same pull request supersedes this run, so the older one is cancelled rather
# than holding runners the newer one is queued for. Every other run gets a group of its own, so a push
# to main is never cancelled or queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The core is meant to compile under Embedded Swift. Apple's Xcode toolchain ships no Embedded standard
# library, so this job installs a swift.org toolchain (via swiftly) that does, then runs the same script
# a developer runs locally.
jobs:
  embedded-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Install a swift.org toolchain with the Embedded stdlib
      run: |
        curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
        tar zxf swiftly-$(uname -m).tar.gz
        ./swiftly init --quiet-shell-followup --assume-yes
        . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
        swiftly install --use latest
        echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"

    - name: Swift version
      run: swift --version

    - name: Verify SwiftMoneyCore, SwiftMoneyFX and SwiftMoneyLocalization compile under Embedded
      run: bash Embedded/verify.sh
