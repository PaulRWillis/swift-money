name: ICU deviation report

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

# Stated rather than inherited from the repository default, since the comment step below needs
# write access to pull requests and nothing here needs more than that.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Non-gating: the tool always exits 0. Runs on both platforms since a platform's ICU can lag the
  # CLDR data the engine renders from.
  report:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    # The same tool also runs against the commit this pull request targets, on the same machine, and
    # only the difference between the two runs is reported. Deviations the branch did not introduce
    # stay quiet, and the platform's own ICU version cancels out because both runs share it.
    - name: Check out the target commit as well
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.sha || 'main' }}
        path: base

    - uses: maxim-lobanov/setup-xcode@v1
      if: ${{ runner.os == 'macOS' }}
      with:
        xcode-version: '26.5'

    - name: Swift version
      run: swift --version

    - name: Run the ICU deviation report on both commits
      run: |
        swift run CompareFormattingToICU > head-output.txt
        swift run --package-path base CompareFormattingToICU > base-output.txt

    # The tool prints one deviation per line and marks everything else with `#`, so dropping those
    # lines and sorting leaves two sets that `comm` can compare. A comment has a hard size limit, so
    # each list is collapsed and cut off well short of it.
    - name: Compare the two runs
      env:
        MAX_LISTED: 40
      run: |
        head_format="$(sed -n 's/^# format: //p' head-output.txt)"
        base_format="$(sed -n 's/^# format: //p' base-output.txt)"

        sed '/^#/d' head-output.txt | sort > head.txt
        summary="$(sed -n 's/^# //p' head-output.txt | grep -v '^format:' | paste -sd ' ' -)"

        if [ "$head_format" != "$base_format" ]; then
          echo incomparable > status.txt
          {
            echo "## ${{ matrix.os }}"
            echo
            echo "This pull request changes the report's own format, so there is nothing to compare it with."
            echo "It finds $(wc -l < head.txt | tr -d ' ') deviation(s). $summary"
            echo
          } > report.md
          exit 0
        fi

        sed '/^#/d' base-output.txt | sort > base.txt
        comm -13 base.txt head.txt > appeared.txt
        comm -23 base.txt head.txt > resolved.txt
        unchanged="$(comm -12 base.txt head.txt | wc -l | tr -d ' ')"

        if [ -s appeared.txt ] || [ -s resolved.txt ]; then
          echo changed > status.txt
        else
          echo unchanged > status.txt
        fi

        list() {
          count="$(wc -l < "$2.txt" | tr -d ' ')"
          [ "$count" -gt 0 ] || return 0

          echo "<details><summary><b>$1: $count</b></summary>"
          echo
          echo '```'
          head -n "$MAX_LISTED" "$2.txt"
          [ "$count" -gt "$MAX_LISTED" ] && echo "... and $((count - MAX_LISTED)) more"
          echo '```'
          echo
          echo "</details>"
          echo
        }

        {
          echo "## ${{ matrix.os }}"
          echo
          list Appeared appeared
          list Resolved resolved
          echo "Unchanged: $unchanged. $summary"
          echo
        } > report.md

    - name: Upload the report
      uses: actions/upload-artifact@v7
      with:
        name: icu-deviations-${{ matrix.os }}
        path: |
          report.md
          status.txt
          head-output.txt
        if-no-files-found: warn

  # One PR comment covering both platforms, so a Linux/macOS ICU divergence is visible side by side
  # rather than split across two separate comments.
  comment:
    needs: report
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: icu-deviations-*
        path: deviations

    - name: Build the combined comment body
      run: |
        {
          echo "<!-- icu-deviations -->"
          echo
          echo "Non-gating. Engine against the platform's ICU, compared with the commit this pull request targets."
          echo
          cat deviations/icu-deviations-*/report.md
        } > comment_body.md

        if grep -qxE 'changed|incomparable' deviations/icu-deviations-*/status.txt; then
          echo "CHANGED=true" >> "$GITHUB_ENV"
        else
          echo "CHANGED=false" >> "$GITHUB_ENV"
        fi

    # Mirrors swift-benchmark-delta.yml's marker/find-or-create technique: a hidden HTML comment
    # lets this workflow find and edit its own comment rather than posting a new one on every push.
    # A distinct marker keeps it from colliding with that workflow's own comment. A run that changes
    # nothing posts nothing, but does refresh a comment an earlier push left behind.
    - name: Comment on PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MARKER: "<!-- icu-deviations -->"
        PR: ${{ github.event.pull_request.number }}
      run: |
        existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          | jq -r --arg marker "$MARKER" \
              '[.[] | select(.body | contains($marker))] | last | .id // empty')"

        if [ "$CHANGED" != "true" ] && [ -z "$existing" ]; then
          echo "No deviation changed and there is no comment to update."
          exit 0
        fi

        body="$(cat comment_body.md)"

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          echo "Updated comment $existing"
        else
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
        fi
