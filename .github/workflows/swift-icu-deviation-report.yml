name: ICU deviation report

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

# Stated rather than inherited from the repository default, since the comment step below needs
# write access to pull requests and nothing here needs more than that.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Non-gating: the tool always exits 0. Runs on both platforms since a platform's ICU can lag the
  # CLDR data the engine renders from.
  report:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - uses: maxim-lobanov/setup-xcode@v1
      if: ${{ runner.os == 'macOS' }}
      with:
        xcode-version: '26.5'

    - name: Swift version
      run: swift --version

    - name: Run the ICU deviation report
      run: swift run CompareFormattingToICU > deviations.txt

    - name: Upload the deviations
      uses: actions/upload-artifact@v7
      with:
        name: icu-deviations-${{ matrix.os }}
        path: deviations.txt
        if-no-files-found: warn

  # One PR comment covering both platforms, so a Linux/macOS ICU divergence is visible side by side
  # rather than split across two separate comments.
  comment:
    needs: report
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: icu-deviations-*
        path: deviations

    # The full per-cell listing can run to thousands of lines, so only the headline count stays
    # visible; the raw listing goes in a collapsed <details> block a reader opens on demand.
    - name: Build the combined comment body
      run: |
        {
          echo "<!-- icu-deviations -->"
          echo
          echo "Non-gating: shows where a platform's ICU differs from the engine's output."
          echo
          for dir in deviations/icu-deviations-*; do
            os="$(basename "$dir" | sed 's/^icu-deviations-//')"
            echo "## $os"
            grep -E '^(Total:|No new deviations|Also skipped)' "$dir/deviations.txt" || true
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```'
            cat "$dir/deviations.txt"
            echo '```'
            echo
            echo "</details>"
            echo
          done
        } > comment_body.md

    # Mirrors swift-benchmark-delta.yml's marker/find-or-create technique: a hidden HTML comment
    # lets this workflow find and edit its own comment rather than posting a new one on every push.
    # A distinct marker keeps it from colliding with that workflow's own comment.
    - name: Comment on PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MARKER: "<!-- icu-deviations -->"
        PR: ${{ github.event.pull_request.number }}
      run: |
        body="$(cat comment_body.md)"
        existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          | jq -r --arg marker "$MARKER" \
              '[.[] | select(.body | contains($marker))] | last | .id // empty')"

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          echo "Updated comment $existing"
        else
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
        fi
