name: Update benchmark results

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Benchmarks/**'

permissions:
  contents: write

jobs:
  update-benchmarks:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.BENCHMARK_PAT }}

    - name: Install jemalloc
      run: sudo apt-get install -y libjemalloc-dev

    - name: Cache the benchmark build
      uses: actions/cache@v6
      with:
        path: |
          Benchmarks/.build
          ~/.cache/org.swift.swiftpm
        key: benchmarks-${{ runner.os }}-${{ hashFiles('Benchmarks/Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Benchmarks/Benchmarks/**/*.swift') }}
        restore-keys: |
          benchmarks-${{ runner.os }}-${{ hashFiles('Benchmarks/Package.resolved') }}-
          benchmarks-${{ runner.os }}-

    - name: Resolve dependencies (with retry)
      run: |
        for attempt in 1 2 3; do
          echo "Resolve attempt $attempt"
          if swift package --package-path Benchmarks resolve; then
            echo "Dependencies resolved successfully"
            break
          fi
          echo "Attempt $attempt failed, cleaning and retrying..."
          rm -rf Benchmarks/.build/repositories
          sleep $((attempt * 10))
        done

    - name: Run benchmarks
      run: |
        swift package --package-path Benchmarks --disable-sandbox benchmark run --format markdown --path stdout --no-progress > benchmark_results.md 2>/dev/null || true

    - name: Fold results into BENCHMARKS.md
      run: |
        if [ ! -s benchmark_results.md ]; then
          echo "No benchmark results generated, skipping."
          exit 0
        fi

        python3 Benchmarks/summarise.py benchmark_results.md BENCHMARKS.md

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet BENCHMARKS.md; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add BENCHMARKS.md
        git commit -m "docs(benchmarks): update benchmark results [skip ci]"
        git push
