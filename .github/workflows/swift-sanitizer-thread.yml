name: Thread sanitizer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # The sanitizer runs the whole test suite, so this is broad. It keeps an unrelated future package (a
    # separate top-level directory) from triggering it. The push trigger above is left unscoped.
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/swift-sanitizer-thread.yml'

jobs:
  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v6

    - name: Swift version
      run: swift --version

    - name: Clean before debug build
      run: swift package clean

    # Serially: the suite runs formatting tests that reach Foundation's ICU, whose lazy locale
    # initialisation is not thread-safe on this platform. Run in parallel under the sanitizer, concurrent
    # ICU calls corrupt each other's output; the sanitizer checks this package's own code, none of which
    # spawns threads, so serialising loses no coverage.
    #
    # The golden suite is skipped for the same reason it is safe to serialise. It hashes the engine's
    # rendering for every covered locale, which is hundreds of thousands of calls and, under the
    # sanitizer, minutes of the budget; none of it spawns a thread, so it finds nothing here. Four
    # other jobs run it.
    - name: Run thread sanitizer
      run: swift test --sanitize=thread --no-parallel --skip MoneyFormatStyleGolden

    - name: Clean before release build
      run: swift package clean

    - name: Run thread sanitizer on release build
      run: swift test --sanitize=thread -c release -Xswiftc -enable-testing --no-parallel --skip MoneyFormatStyleGolden
