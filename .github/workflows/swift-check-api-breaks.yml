name: Swift check API breaks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  analyze-api-breakage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    # Always reported, never fatal, so the list of what changed is in the log for review even when
    # the break is intended. Also warms the build, which the first run needs.
    - name: Report API changes
      continue-on-error: true
      run: swift package diagnose-api-breaking-changes origin/main --targets SwiftMoney

    # Enforced only when the pull request does not declare a breaking change. A conventional-commit
    # `!` is the author saying "this breaks the API on purpose", so failing it again adds nothing.
    # A PR without the marker that breaks the API is a genuine mistake, and still fails here.
    - name: Analyze API breakage
      if: ${{ !contains(github.event.pull_request.title, '!:') }}
      run: swift package diagnose-api-breaking-changes origin/main --targets SwiftMoney
