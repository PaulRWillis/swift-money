version: 2
updates:
  # Watches the pinned CLDR JSON packages. A new CLDR release arrives as a version-bump PR, which the
  # CLDR-localization-data workflow then regenerates the Swift tables against.
  - package-ecosystem: npm
    directory: /Tools/cldr
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # Both packages carry one release of the same data, so they arrive as one pull request. Ungrouped,
    # each came as its own, and merging either alone would generate the tables from two releases at
    # once; the generator now refuses such a pair, which would have failed that PR rather than silently
    # mixing them.
    groups:
      cldr:
        patterns:
          - "cldr-*"

  # Watches the Swift packages the dev-only targets build against.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
